name: Validate Documentation Files

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Required Files Exist
        run: |
          echo "Checking required documentation files..."
          test -f docs/schema.sql || (echo "Missing docs/schema.sql" && exit 1)
          test -f docs/api-endpoint-plan.md || (echo "Missing docs/api-endpoint-plan.md" && exit 1)
          echo "All required documentation files are present!"
